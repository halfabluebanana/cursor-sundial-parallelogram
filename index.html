<!DOCTYPE html>

<head>
    <html lang="en">
    <meta charset="UTF-8">
    <title> Cursor Sundial </title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0 shrink-to-fit=yes">
    <link rel="preload" href="style.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap"
        rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>
</head>

<script>
    function coordinate(event) {
        document.getElementById("X").value = event.clientX;
        document.getElementById("Y").value = event.clientY;
    }
</script>

<body onmousemove="coordinate(event)">

    <div id="cursors">
        <div class="custom-cursor"></div>
        <div class="cursor-shadow"></div>
    </div>

    <div class="info-bar">
        <div class="info-col">
            <h4>Geolocation</h4>
            <p id="location">Waiting for location...</p>
        </div>
        <div class="info-col">
            <h4>Mouse Cursor</h4>
            <label>X <input type="text" id="X" readonly></label>
            <label>Y <input type="text" id="Y" readonly></label>
        </div>
        <div class="info-col">
            <h4>Sun Position</h4>
            <label>Sunrise <input type="text" id="sunrise" readonly></label>
            <label>Sunset <input type="text" id="sunset" readonly></label>
        </div>
        <div class="info-col">
            <h4>Shadow Info</h4>
            <label>Azimuth <input type="text" id="shadowAngle" readonly> deg</label>
            <label>Length <input type="text" id="shadowLength" readonly></label>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="suncalculation.js"></script>
    <script src="cursor.js" defer></script>

</body>

</html>
